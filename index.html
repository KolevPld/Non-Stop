<!DOCTYPE html>
<html lang="bg">
 <style>
  :root {
    --bg-color: #ffffff;
    --text-color: #1a1a1a;
    --card-bg: #f9f9f9;
    --input-bg: #f0f0f0;
    --border-color: #ccc;
    --accent-color: #4caf50;
    --danger-color: #e74c3c;
  }

  body.dark {
    --bg-color: #121212;
    --text-color: #e0e0e0;
    --card-bg: #1f1f1f;
    --input-bg: #2a2a2a;
    --border-color: #4caf50;
    --accent-color: #66bb6a;
    --danger-color: #e74c3c;
  }

  body {
    background: var(--bg-color);
    color: var(--text-color);
    transition: background 0.3s ease, color 0.3s ease;
  }

  button.theme-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    z-index: 999;
  }

  button.theme-toggle:hover {
    background: #388e3c;
  }
</style>
 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Нон Стоп Отчет</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="Смени тема">🌗</button>
 <!-- 🔐 Login/Register секция -->
<div id="loginScreen">
  <h2><i class="fa-solid fa-user-lock"></i> Вход / Регистрация</h2>
  <input type="email" id="loginEmail" placeholder="Имейл">
  <input type="password" id="loginPassword" placeholder="Парола">
  <div style="margin: 10px 0;">
    <button onclick="loginEmail()">🔑 Вход</button>
    <button onclick="registerEmail()">📝 Регистрация</button>
  </div>
</div>

<div id="status" style="margin:10px 0;">⏳ Изчакване за връзка...</div>
<div id="logoutArea" style="margin: 10px 0;">
  <button onclick="logout()" style="background:#607d8b; color:#fff; padding:8px 12px;">
    <i class="fa-solid fa-right-from-bracket"></i> Изход
  </button>
</div>

<div id="app" class="hidden">
  <div id="screen-add">
  <h2><i class="fa-solid fa-cash-register"></i> Нон Стоп Отчет</h2>

  <form id="addForm">

      <label for="date">📅 Дата</label>
      <input type="date" id="date">

      <label for="type">💵 Тип</label>
      <select id="type">
        <option>Приход</option>
        <option>Разход</option>
      </select>

      <label for="method">💳 Метод</label>
       <select id="method">
       <option value="Кеш">Кеш 💰</option>
       <option value="Банка">Банка 🏦</option>
       <option value="Карта">Карта 💳</option>
       </select>

      <label for="store">🏬 Магазин</label>
      <select id="store">
        <option value="1">Магазин 1</option>
        <option value="2">Магазин 2</option>
        <option value="Каса">Каса</option>
      </select>

      <label for="category">🏷️ Категория</label>
      <select id="category" onchange="toggleCustomCategory()">
        <option>Оборот</option>
        <option>Стока</option>
        <option>Заплати</option>
        <option>Наеми</option>
        <option>Друго</option>
        <option value="custom">Въведи ръчно...</option>
      </select>
      <input type="text" id="customCategory" class="hidden" placeholder="Въведи категория...">

      <label for="amount">💸 Сума</label>
      <input type="number" id="amount">

      <label for="noteSelect">📝 Бележка</label>
      <select id="noteSelect" onchange="toggleCustomNote()">
        <option value="М1">М1</option>
        <option value="М2">М2</option>
        <option value="custom">Въведи ръчно...</option>
      </select>

      <input type="text" id="customNote" placeholder="Въведи бележка..." class="hidden">
      <label>📷 Снимка на документ</label>

<button type="button" onclick="openUploadWidget()">
  📷 Качи снимка
</button>

<img id="imagePreview"
     class="hidden"
     style="max-height:80px;margin-top:6px;border-radius:6px;cursor:pointer;"
     onclick="openImageModal(this.src)">

<button type="button"
        onclick="removeImage()"
        style="margin-top:5px;background:#e74c3c;color:white;">
  🗑️ Премахни снимка
</button>
  </form>

  <div class="btn-group">
    <button onclick="addRecord()"><i class="fa-solid fa-plus"></i> Добави запис</button>
  </div>
  <div class="btn-group">
    <button class="admin-only" onclick="showScreen('report')">📊 Отчети</button>
  </div>

  <div class="summary" id="totalSummary"></div>

  <div class="summary">
    <h3><i class="fa-solid fa-clock-rotate-left"></i> Последни 5 записа</h3>
    <table id="recentTable">
      <thead>
  <tr>
    <th>Дата</th>
    <th>Тип</th>
    <th>Сума</th>
    <th>Метод</th>
    <th>Кат.</th>         <!-- 👈 ДОБАВЕНО -->
    <th>Бележка</th>
    <th>Действие</th>
  </tr>
</thead>
      <tbody></tbody>
    </table>
  </div>
</div>

  <div id="screen-report" class="hidden admin-only">
    <h3><i class="fa-solid fa-chart-pie"></i> Отчети</h3>
    <div class="summary" id="methodSummary"></div>
    <div class="summary" id="methodSummaryExtra"></div>
    <div class="summary" id="dailySummary"></div>
    <div class="summary" id="monthlySummary"></div>
    <div class="summary" id="taxSummary"></div>

    <canvas id="chart" width="400" height="200" style="margin-top:20px;"></canvas>

    <div class="btn-group" style="margin: 15px 0;">
      <button onclick="showScreen('add')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
    </div>

    <div class="date-range-group" style="margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <label for="startDate" style="flex: 1; min-width: 140px;">
        От:<br>
        <input type="date" id="startDate" onchange="applyFilters()" style="width: 100%; padding: 8px; font-size: 14px;">
      </label>
      <label for="endDate" style="flex: 1; min-width: 140px;">
        До:<br>
        <input type="date" id="endDate" onchange="applyFilters()" style="width: 100%; padding: 8px; font-size: 14px;">
      </label>
      <button onclick="setCurrentMonth()" style="padding: 10px 12px; font-size: 14px; background: #607d8b; color: #fff;">
        <i class="fa-solid fa-calendar-days"></i> Текущ месец
      </button>
    </div>

    <div class="summary" style="margin-bottom:10px;">
      <h3><i class="fa-solid fa-filter"></i> Филтрирай записите</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <select id="filterType" onchange="applyFilters()" style="flex:1;">
          <option value="">Всички типове</option>
          <option>Приход</option>
          <option>Разход</option>
        </select>
        <select id="filterMethod" onchange="applyFilters()" style="flex:1;">
          <option value="">Всички методи</option>
          <option>Кеш</option>
          <option>Банка</option>
          <option>Карта</option>
        </select>
        <select id="filterCategory" onchange="applyFilters()" style="flex:1;">
          <option value="">Всички категории</option>
          <option>Оборот</option>
          <option>Стока</option>
          <option>Заплати</option>
          <option>Наеми</option>
          <option>Друго</option>
        </select>
        <select id="filterStore" onchange="applyFilters()" style="flex:1;">
          <option value="">Всички магазини</option>
          <option value="1">Магазин 1</option>
          <option value="2">Магазин 2</option>
          <option value="Каса">Каса</option>
        </select>
      </div>
    </div>

    <div style="text-align:right; margin-top:10px;">
      <button onclick="clearFilters()" style="background:#757575;">Изчисти филтрите</button>
    </div>

    <div class="btn-group" style="margin: 15px 0; display: flex; gap: 10px; flex-wrap: wrap;">
      <button onclick="printFilteredTable()" style="background:#607d8b;"><i class="fa-solid fa-print"></i> Принтирай</button>
      <button onclick="exportFilteredToExcel()" style="background:#388e3c;"><i class="fa-solid fa-file-excel"></i> Ексел</button>
    </div>

    <div id="filterSummary" class="summary" style="margin-top:10px;"></div>

    <div class="table-responsive admin-only">
      <table id="recordsTable">
        <thead>
          <tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Кат.</th><th>Бележка</th><th>Действия</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<script src="main.js" type="module"></script>

 <script>
  function toggleTheme() {
    const body = document.body;
    const button = document.querySelector('.theme-toggle');
    const isDark = body.classList.toggle('dark-theme');

    // Запазваме избора
    localStorage.setItem('theme', isDark ? 'dark' : 'light');

    // Смяна на иконката
    button.innerText = isDark ? '☀️' : '🌙';
  }

  // Автоматично зареждане на запазената тема
  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    const button = document.querySelector('.theme-toggle');

    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
      if (button) button.innerText = '☀️';
    } else {
      if (button) button.innerText = '🌙';
    }
  });
</script>
 
 <!-- 📷 Модален преглед на изображение -->
<div id="imageModal" class="hidden" style="
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
  z-index: 9999;">
  <div style="position: relative; max-width: 90%; max-height: 90%;">
    <img id="modalImage" src="" alt="Документ" style="max-width: 100%; max-height: 100%; border-radius: 8px;">
    <button onclick="closeImageModal()" style="
      position: absolute; top: -10px; right: -10px; background: #f44336; color: white;
      border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 18px;">✖</button>
  </div>
</div>
 <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

<script>
  let uploadedImageUrl = "";

  function openUploadWidget() {
    cloudinary.openUploadWidget(
      {
        cloudName: "ТУК_ТВОЯ_CLOUD_NAME",
        uploadPreset: "ml_default",
        sources: ["local", "camera"],
        multiple: false,
        resourceType: "image",
        maxFileSize: 5000000
      },
      (error, result) => {
        if (!error && result && result.event === "success") {
          uploadedImageUrl = result.info.secure_url;

          document.getElementById("imagePreview").src = uploadedImageUrl;
          document.getElementById("imagePreview").classList.remove("hidden");
        }
      }
    );
  }

  function removeImage() {
    uploadedImageUrl = "";
    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreview").classList.add("hidden");
  }
</script>

</body>
</html>

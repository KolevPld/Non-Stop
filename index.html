<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Нон Стоп Отчет</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="status">⏳ Свързване с Firestore...</div>

<div id="login">
  <h2><i class="fa-solid fa-lock"></i> Въведи парола</h2>
  <input type="password" id="password" placeholder="Парола">
  <button onclick="checkPassword()">Вход</button>
</div>

<div id="app" class="hidden">
  <section id="screen-add" class="screen">
  <header class="screen-header">
    <h2><i class="fa-solid fa-cash-register"></i> Нон Стоп Отчет</h2>
  </header>

  <form id="addForm" class="form-section">
    <label>📅 Дата</label><input type="date" id="date">

    <label>💵 Тип</label>
    <select id="type">
      <option>Приход</option>
      <option>Разход</option>
    </select>

    <label>💳 Метод</label>
    <select id="method">
      <option>Кеш 💰</option>
      <option>Банка 🏦</option>
      <option>Карта 💳</option>
    </select>

    <label>🏬 Магазин</label>
    <select id="store">
      <option value="1">Магазин 1</option>
      <option value="2">Магазин 2</option>
      <option value="Каса">Каса</option>
    </select>

    <label>🏷️ Категория</label>
    <select id="category" onchange="toggleCustomCategory()">
      <option>Оборот</option>
      <option>Стока</option>
      <option>Заплати</option>
      <option>Наеми</option>
      <option>Друго</option>
      <option value="custom">Въведи ръчно...</option>
    </select>

    <label>💸 Сума</label><input type="number" id="amount">

    <label>📝 Бележка</label>
    <select id="noteSelect" onchange="toggleCustomNote()">
      <option value="М1">М1</option>
      <option value="М2">М2</option>
      <option value="custom">Въведи ръчно...</option>
    </select>
    <input type="text" id="customNote" placeholder="Въведи бележка..." class="hidden">
  </form>

  <div class="btn-group">
    <button onclick="addRecord()"><i class="fa-solid fa-plus"></i> Добави запис</button>
    <button onclick="showScreen('report')">📊 Отчети</button>
  </div>

  <div class="summary" id="totalSummary"></div>

  <div class="summary recent-records">
    <h3><i class="fa-solid fa-clock-rotate-left"></i> Последни 5 записа</h3>
    <table id="recentTable">
      <thead>
        <tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Бележка</th><th>Действие</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
<script src="main.js" type="module"></script>

</body>
</html>

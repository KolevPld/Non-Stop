<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нон Стоп Отчет</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #121212;
      --text: #fff;
      --accent: #4caf50;
    }
    body.light {
      --bg: #f5f5f5;
      --text: #000;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      border: none;
      border-radius: 5px;
    }
    button { cursor: pointer; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
    }
    .btn-green { background: var(--accent); color: white; }
    .btn-blue { background: #2196f3; color: white; }
    .btn-red { background: #f44336; color: white; }
    .theme-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 24px;
      color: var(--text);
      cursor: pointer;
    }
    .add-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #fff;
      font-size: 28px;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()">
  <i class="fa-solid fa-moon"></i>
</button>
<div id="login">
  <h2><i class="fa-solid fa-lock"></i> Въведи парола</h2>
  <input type="password" id="password" placeholder="Парола">
  <button class="btn-green" onclick="checkPassword()">Вход</button>
</div>

<div id="app" class="hidden">
  <h2><i class="fa-solid fa-calendar"></i> Нон Стоп Отчет</h2>

  <label>Дата</label>
  <input type="date" id="date">

  <label>Тип</label>
  <select id="type">
    <option>Приход</option>
    <option>Разход</option>
  </select>

  <label>Метод</label>
  <select id="method">
    <option>Кеш</option>
    <option>Банка</option>
    <option>Карта</option>
  </select>

  <label>Сума</label>
  <input type="number" id="amount">

  <label>Бележка</label>
  <input type="text" id="note">

  <button class="btn-green" onclick="addRecord()"><i class="fa-solid fa-plus"></i> Добави запис</button>
  <button class="btn-blue" onclick="showScreen('report')"><i class="fa-solid fa-chart-column"></i> Отчети</button>

  <div id="totalSummary" style="margin-top:10px;"></div>

  <table id="recordsTable">
    <thead>
      <tr>
        <th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Бележка</th><th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="pagination" style="margin-top:10px;"></div>

  <div style="margin-top:20px;">
    <button onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
    <button onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
  </div>
</div>

<a class="add-float" href="javascript:showScreen('add')">
  <i class="fa-solid fa-plus"></i>
</a>
<script>
const PASSWORD_HASH = "07c308c2fa9dd8d58234e4dc6e4ae31327ed179a3e499836e51c06a6ae0f4393"; 
// SHA-256 на '7801'

let records = [];
let currentPage = 1;
const perPage = 20;

document.addEventListener("DOMContentLoaded", () => {
  if (localStorage.getItem("theme") === "light") document.body.classList.add("light");
  loadFromLocal();
  handleHash();
});

window.addEventListener("hashchange", handleHash);
function handleHash() {
  if (location.hash === "#report") showScreen("report");
  else showScreen("add");
}

function toggleTheme() {
  document.body.classList.toggle("light");
  localStorage.setItem("theme", document.body.classList.contains("light") ? "light" : "dark");
}

async function checkPassword() {
  const encoder = new TextEncoder();
  const data = encoder.encode(document.getElementById("password").value);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  if (hashHex === PASSWORD_HASH) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
    renderPaginatedTable();
  } else {
    alert("Грешна парола!");
  }
}

function addRecord() {
  const date = document.getElementById("date").value;
  const type = document.getElementById("type").value;
  const method = document.getElementById("method").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const note = document.getElementById("note").value;
  if (!date || isNaN(amount)) return alert("Попълни дата и сума.");
  records.push({ date, type, method, amount, note });
  saveToLocal();
  renderPaginatedTable();
  clearForm();
}

function clearForm() {
  document.getElementById("date").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
}

function saveToLocal() {
  localStorage.setItem("nonstop_records", JSON.stringify(records));
}

function loadFromLocal() {
  const saved = localStorage.getItem("nonstop_records");
  if (saved) records = JSON.parse(saved);
}

function renderPaginatedTable() {
  const tbody = document.querySelector("#recordsTable tbody");
  tbody.innerHTML = "";
  const start = (currentPage - 1) * perPage;
  const paginated = records.slice(start, start + perPage);

  let income = 0, expense = 0;
  paginated.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date}</td>
      <td style="color:${r.type==='Приход'?'#4caf50':'#f44336'};">
        ${r.type==='Приход' ? '<i class="fa-solid fa-arrow-up"></i>' : '<i class="fa-solid fa-arrow-down"></i>'}
        ${r.type}
      </td>
      <td>${r.amount.toFixed(2)} лв</td>
      <td>${r.method}</td>
      <td>${r.note}</td>
      <td>
        <button onclick="deleteRecord(${start + i})" class="btn-red" style="font-size:12px;"><i class="fa-solid fa-trash"></i></button>
      </td>
    `;
    tbody.appendChild(tr);
    if (r.type === "Приход") income += r.amount;
    else expense += r.amount;
  });
  document.getElementById("totalSummary").innerHTML = `
    Приходи: ${income.toFixed(2)} лв | Разходи: ${expense.toFixed(2)} лв | Баланс: ${(income-expense).toFixed(2)} лв`;

  const pages = Math.ceil(records.length / perPage);
  document.getElementById("pagination").innerHTML = `
    Страница ${currentPage} от ${pages}
    <button onclick="prevPage()">⬅</button>
    <button onclick="nextPage()">➡</button>
  `;
}

function prevPage() {
  if (currentPage > 1) { currentPage--; renderPaginatedTable(); }
}
function nextPage() {
  if (currentPage * perPage < records.length) { currentPage++; renderPaginatedTable(); }
}

function deleteRecord(i) {
  if (!confirm("Сигурен ли си?")) return;
  records.splice(i,1);
  saveToLocal();
  renderPaginatedTable();
}

function exportToExcel() {
  alert("Тук може да вградиш XLSX или jsPDF – готов за добавяне.");
}

function showScreen(name) {
  location.hash = name === "report" ? "#report" : "#add";
}
</script>

<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Нон Стоп Отчет</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; background: #121212; color: #fff; padding: 20px; max-width: 700px; margin: auto; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; font-size: 16px; border: none; border-radius: 5px; }
    button { cursor: pointer; background: #2196f3; color: white; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #333; }
    .hidden { display: none; }
    .summary { background: #1e1e1e; padding: 10px; margin-top: 10px; border-radius: 5px; }
    .btn-group { display: flex; gap: 10
<div id="login">
  <h2>🔐 Въведи парола</h2>
  <input type="password" id="password" placeholder="Парола">
  <button onclick="checkPassword()" style="max-width:200px;margin:10px auto;display:block;">Вход</button>
</div>

<div id="app" class="hidden">
  <div id="screen-add">
    <h2>📋 Нон Стоп Отчет</h2>
    <label>Дата</label><input type="date" id="date">
    <label>Тип</label><select id="type"><option>Приход</option><option>Разход</option></select>
    <label>Метод</label><select id="method"><option>Кеш</option><option>Банка</option><option>Карта</option></select>
    <label>Сума</label><input type="number" id="amount">
    <label>Бележка</label><input type="text" id="note">
    <div class="btn-group">
      <button onclick="addRecord()">Добави запис</button>
      <button id="editBtn" onclick="saveEditedRecord()" style="display:none;background:#4caf50;">💾 Запази</button>
    </div>
    <div class="btn-group">
      <button onclick="showScreen('report')">📊 Отчети</button>
      <button onclick="window.print()">🖨️ Принтирай</button>
    </div>
    <div class="summary" id="totalSummary"></div>
  </div>

  <div id="screen-report" class="hidden">
    <h3>📊 Отчети</h3>
    <div style="margin-top:20px;">
      <label>🔍 Търси по бележка:</label>
      <input type="text" id="filterNote" oninput="renderFilteredTable()">
      <label>📆 От дата:</label>
      <input type="date" id="filterFrom" onchange="renderFilteredTable()">
      <label>До дата:</label>
      <input type="date" id="filterTo" onchange="renderFilteredTable()">
      <label>Тип:</label>
      <select id="filterType" onchange="renderFilteredTable()">
        <option value="">Всички</option>
        <option value="Приход">Приход</option>
        <option value="Разход">Разход</option>
      </select>
      <label>Метод:</label>
      <select id="filterMethod" onchange="renderFilteredTable()">
        <option value="">Всички</option>
        <option value="Кеш">Кеш</option>
        <option value="Банка">Банка</option>
        <option value="Карта">Карта</option>
      </select>
    </div>
    <div class="summary" id="dailySummary"></div>
    <div class="summary" id="monthlySummary"></div>
    <canvas id="chart" width="400" height="200" style="margin-top:20px;"></canvas>
    <button onclick="showScreen('add')">⬅️ Назад</button>
  </div>

  <div id="screen-add">
    <table id="recordsTable">
      <thead>
        <tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Бележка</th><th>Действия</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="btn-group" style="margin-top:20px;">
      <button onclick="exportToExcel()">📤 Excel</button>
      <button onclick="exportToPDF()">📄 PDF</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD692ktQboNPavUgo9XiANtaqm-8tUOB6c",
  authDomain: "nonstopapp-c30b1.firebaseapp.com",
  projectId: "nonstopapp-c30b1",
  storageBucket: "nonstopapp-c30b1.firebasestorage.app",
  messagingSenderId: "368870682423",
  appId: "1:368870682423:web:5f0ff3245c07c7796a74b2",
  measurementId: "G-G2N5CSYPD7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();

let userId = null;
let records = [];
let chartRef = null;

signInAnonymously(auth)
  .then(() => console.log("Signed in anonymously"))
  .catch(console.error);

onAuthStateChanged(auth, user => {
  if (user) {
    userId = user.uid;
    loadFromFirestore();
  }
});

async function loadFromFirestore() {
  records = [];
  const q = query(collection(db, "users", userId, "records"), orderBy("date", "desc"));
  const snapshot = await getDocs(q);
  snapshot.forEach(docSnap => records.push({ id: docSnap.id, ...docSnap.data() }));
  renderTable(); updateSummaries(); renderChart();
}

async function addRecord() {
  const date = document.getElementById("date").value;
  const type = document.getElementById("type").value;
  const method = document.getElementById("method").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const note = document.getElementById("note").value;
  if (!date || isNaN(amount)) return alert("Попълни дата и сума.");
  await addDoc(collection(db, "users", userId, "records"), { date, type, method, amount, note });
  loadFromFirestore();
  clearForm();
}

async function deleteRecord(id) {
  if (!confirm("Сигурен ли си?")) return;
  await deleteDoc(doc(db, "users", userId, "records", id));
  loadFromFirestore();
}

function clearForm() {
  document.getElementById("date").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
}

function renderTable() {
  const tbody = document.querySelector("#recordsTable tbody");
  tbody.innerHTML = "";
  let income = 0, expense = 0;
  records.forEach((r) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date}</td>
      <td style="color:${r.type==='Приход'?'#4caf50':'#f44336'};">${r.type}</td>
      <td>${r.amount.toFixed(2)} лв</td>
      <td>${r.method}</td>
      <td>${r.note}</td>
      <td><button onclick="deleteRecord('${r.id}')" style="background:#f44336;font-size:12px;padding:4px 6px;">🗑️</button></td>`;
    tbody.appendChild(tr);
    if (r.type === "Приход") income += r.amount;
    if (r.type === "Разход") expense += r.amount;
  });
  const balance = income - expense;
  document.getElementById("totalSummary").innerHTML = `
    Приходи: ${income.toFixed(2)} лв | Разходи: ${expense.toFixed(2)} лв | Баланс: ${balance.toFixed(2)} лв`;
}

function showScreen(name) {
  document.getElementById("screen-add").classList.add("hidden");
  document.getElementById("screen-report").classList.add("hidden");
  document.getElementById("screen-" + name).classList.remove("hidden");
}

function updateSummaries() {
  let todayIncome=0, todayExpense=0, monthIncome=0, monthExpense=0;
  const today = new Date().toISOString().slice(0,10);
  const month = today.slice(0,7);
  records.forEach(r=>{
    if(r.date===today){ if(r.type==="Приход")todayIncome+=r.amount; else todayExpense+=r.amount;}
    if(r.date.startsWith(month)){ if(r.type==="Приход")monthIncome+=r.amount; else monthExpense+=r.amount;}
  });
  document.getElementById("dailySummary").innerHTML = 
    `📅 <strong>Днес:</strong> Приходи: ${todayIncome.toFixed(2)} лв | Разходи: ${todayExpense.toFixed(2)} лв`;
  document.getElementById("monthlySummary").innerHTML = 
    `📆 <strong>Месец:</strong> Приходи: ${monthIncome.toFixed(2)} лв | Разходи: ${monthExpense.toFixed(2)} лв`;
}

function renderChart() {
  const ctx = document.getElementById('chart').getContext('2d');
  const monthData = {};
  records.forEach(r=>{
    const m = r.date?.slice(0,7);
    if(!m) return;
    if(!monthData[m]) monthData[m]={income:0,expense:0};
    if(r.type==="Приход") monthData[m].income+=r.amount;
    if(r.type==="Разход") monthData[m].expense+=r.amount;
  });
  const labels = Object.keys(monthData).sort();
  const incomeData = labels.map(m=>monthData[m].income);
  const expenseData = labels.map(m=>monthData[m].expense);

  if(chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Приходи', data: incomeData, backgroundColor:'#4caf50' },
        { label: 'Разходи', data: expenseData, backgroundColor:'#f44336' }
      ]
    },
    options: { responsive:true, plugins:{ legend:{position:'top'}, title:{display:true,text:'Приходи и разходи по месеци'}}}
  });
}

window.exportToExcel = () => {
  const wb = XLSX.utils.book_new();
  const rows = [["Дата", "Тип", "Сума", "Метод", "Бележка"]];
  records.forEach(r=>rows.push([r.date, r.type, r.amount.toFixed(2), r.method, r.note]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "Отчет");
  XLSX.writeFile(wb, "nonstop_otchet.xlsx");
};

window.exportToPDF = () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Нон Стоп Отчет",14,14);
  let y=24;
  records.forEach(r=>{
    doc.text(`${r.date} | ${r.type} | ${r.amount.toFixed(2)} лв | ${r.method} | ${r.note}`,14,y);
    y+=8; if(y>280){ doc.addPage(); y=20; }
  });
  doc.save("nonstop_otchet.pdf");
};

window.renderFilteredTable = function(){ alert("Филтрите сега връщат всички записи — може да се настроят да четат директно от Firestore при нужда."); };

window.checkPassword = function(){
  document.getElementById("login").style.display = "none";
  document.getElementById("app").classList.remove("hidden");
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нон Стоп Отчет</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: auto; padding: 20px; background: #f7f7f7; }
    input, select, button { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    .summary { margin-top: 20px; font-weight: bold; }
    .btn-small { font-size: 14px; padding: 4px 8px; }
    .filters { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .filters div { flex: 1; }
  </style>
</head>
<body>

<h2>Нон Стоп Отчет</h2>

<input type="date" id="date">
<select id="type"><option>Приход</option><option>Разход</option></select>
<select id="method"><option>Кеш</option><option>Банка</option><option>Карта</option></select>
<input type="number" id="amount" placeholder="Сума">
<input type="text" id="note" placeholder="Бележка">
<button onclick="addRecord()">Добави запис</button>

<div class="filters">
  <div>
    <label>От дата</label>
    <input type="date" id="filterFrom" onchange="renderTable()">
  </div>
  <div>
    <label>До дата</label>
    <input type="date" id="filterTo" onchange="renderTable()">
  </div>
</div>

<table id="recordsTable">
  <thead>
    <tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Бележка</th><th>Действие</th></tr>
  </thead>
  <tbody></tbody>
</table>

<div class="summary" id="summary"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD692ktQboNPavUgo9XiANtaqm-8tUOB6c",
  authDomain: "nonstopapp-c30b1.firebaseapp.com",
  projectId: "nonstopapp-c30b1",
  storageBucket: "nonstopapp-c30b1.appspot.com",
  messagingSenderId: "368870682423",
  appId: "1:368870682423:web:5f0ff3245c07c7796a74b2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();

let records = [];

signInAnonymously(auth).catch(console.error);

onAuthStateChanged(auth, user => {
  if (user) loadRecords();
});
async function loadRecords() {
  records = [];
  const q = query(collection(db, "records"), orderBy("date", "desc"));
  const snapshot = await getDocs(q);
  snapshot.forEach(docSnap => {
    records.push({ id: docSnap.id, ...docSnap.data() });
  });
  renderTable();
}

async function addRecord() {
  const date = document.getElementById("date").value;
  const type = document.getElementById("type").value;
  const method = document.getElementById("method").value;
  const amount = parseFloat(document.getElementById("amount").value);
  const note = document.getElementById("note").value.trim();

  if (!date || isNaN(amount)) {
    alert("Моля, въведи валидна дата и сума.");
    return;
  }

  await addDoc(collection(db, "records"), {
    date, type, method, amount, note
  });

  clearForm();
  loadRecords();
}

async function deleteRecord(id) {
  if (!confirm("Наистина ли искаш да изтриеш този запис?")) return;
  await deleteDoc(doc(db, "records", id));
  loadRecords();
}

function clearForm() {
  document.getElementById("date").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("note").value = "";
}

function renderTable() {
  const tbody = document.querySelector("#recordsTable tbody");
  const from = document.getElementById("filterFrom").value;
  const to = document.getElementById("filterTo").value;
  tbody.innerHTML = "";

  let income = 0, expense = 0;

  records.filter(r => {
    if (from && r.date < from) return false;
    if (to && r.date > to) return false;
    return true;
  }).forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.date}</td>
      <td style="color:${r.type === 'Приход' ? 'green' : 'red'}">${r.type}</td>
      <td>${r.amount.toFixed(2)}</td>
      <td>${r.method}</td>
      <td>${r.note}</td>
      <td><button class="btn-small" onclick="deleteRecord('${r.id}')">🗑️</button></td>
    `;
    tbody.appendChild(tr);

    if (r.type === "Приход") income += r.amount;
    else expense += r.amount;
  });

  const balance = income - expense;
  document.getElementById("summary").textContent =
    `Приходи: ${income.toFixed(2)} лв | Разходи: ${expense.toFixed(2)} лв | Баланс: ${balance.toFixed(2)} лв`;
}
</script>
</body>
</html>

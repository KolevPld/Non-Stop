<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Нон Стоп Отчет</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="modern.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="main-header">
    <div class="container">
      <h1 class="logo">📊 Нон Стоп Отчет</h1>
      <div class="user-actions">
        <span id="status">⏳ Изчакване...</span>
        <button id="logoutBtn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Изход</button>
      </div>
    </div>
  </header>

  <main class="app-container">

    <!-- 🔐 Login/Register -->
    <section id="loginScreen" class="card centered">
      <h2><i class="fa-solid fa-user-lock"></i> Вход / Регистрация</h2>
      <input type="email" id="loginEmail" placeholder="Имейл">
      <input type="password" id="loginPassword" placeholder="Парола">
      <div class="btn-group">
        <button onclick="loginEmail()">🔑 Вход</button>
        <button onclick="registerEmail()">📝 Регистрация</button>
      </div>
    </section>

    <!-- 📄 Основно приложение -->
    <div id="app" class="hidden">

      <!-- 📥 Добавяне на запис -->
      <section id="screen-add">
        <div class="card">
          <h2><i class="fa-solid fa-cash-register"></i> Нов запис</h2>
          <form id="addForm" class="grid-form">
            <label>📅 Дата <input type="date" id="date"></label>
            <label>💵 Тип
              <select id="type">
                <option>Приход</option>
                <option>Разход</option>
              </select>
            </label>
            <label>💳 Метод
              <select id="method">
                <option>Кеш 💰</option>
                <option>Банка 🏦</option>
                <option>Карта 💳</option>
              </select>
            </label>
            <label>🏬 Магазин
              <select id="store">
                <option>Магазин 1</option>
                <option>Магазин 2</option>
                <option>Каса</option>
              </select>
            </label>
            <label>🏷️ Категория
              <select id="category" onchange="toggleCustomCategory()">
                <option>Оборот</option>
                <option>Стока</option>
                <option>Заплати</option>
                <option>Наеми</option>
                <option>Друго</option>
                <option value="custom">Въведи ръчно...</option>
              </select>
              <input type="text" id="customCategory" class="hidden" placeholder="Въведи категория...">
            </label>
            <label>💸 Сума <input type="number" id="amount"></label>
            <label>📝 Бележка
              <select id="noteSelect" onchange="toggleCustomNote()">
                <option>М1</option>
                <option>М2</option>
                <option value="custom">Въведи ръчно...</option>
              </select>
              <input type="text" id="customNote" class="hidden" placeholder="Въведи бележка...">
            </label>
          </form>

          <div class="btn-group">
            <button onclick="addRecord()"><i class="fa-solid fa-plus"></i> Добави запис</button>
            <button class="admin-only" onclick="showScreen('report')">📊 Отчети</button>
          </div>
        </div>

        <!-- ✅ Обобщение + Последни записи -->
        <div class="summary-grid">
          <div class="summary" id="totalSummary"></div>
          <div class="card">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> Последни 5 записа</h3>
            <table id="recentTable">
              <thead><tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Бележка</th><th>Действие</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 📊 Екран с отчети -->
      <section id="screen-report" class="hidden admin-only">
        <div class="card">
          <h3><i class="fa-solid fa-chart-pie"></i> Отчети</h3>
          <div class="summary" id="methodSummary"></div>
          <div class="summary" id="methodSummaryExtra"></div>
          <div class="summary" id="dailySummary"></div>
          <div class="summary" id="monthlySummary"></div>
          <div class="summary" id="taxSummary"></div>
          <canvas id="chart" width="400" height="200"></canvas>
          <div class="btn-group">
            <button onclick="showScreen('add')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
          </div>
        </div>

        <!-- 📅 Филтри и дата -->
        <div class="card">
          <h3><i class="fa-solid fa-filter"></i> Филтрирай записите</h3>
          <div class="filters">
            <input type="date" id="startDate" onchange="applyFilters()">
            <input type="date" id="endDate" onchange="applyFilters()">
            <button onclick="setCurrentMonth()"><i class="fa-solid fa-calendar-days"></i> Текущ месец</button>
            <select id="filterType" onchange="applyFilters()">
              <option value="">Тип</option>
              <option>Приход</option>
              <option>Разход</option>
            </select>
            <select id="filterMethod" onchange="applyFilters()">
              <option value="">Метод</option>
              <option>Кеш</option>
              <option>Банка</option>
              <option>Карта</option>
            </select>
            <select id="filterCategory" onchange="applyFilters()">
              <option value="">Категория</option>
              <option>Оборот</option>
              <option>Стока</option>
              <option>Заплати</option>
              <option>Наеми</option>
              <option>Друго</option>
            </select>
            <select id="filterStore" onchange="applyFilters()">
              <option value="">Магазин</option>
              <option>Магазин 1</option>
              <option>Магазин 2</option>
              <option>Каса</option>
            </select>
            <button onclick="clearFilters()">Изчисти</button>
          </div>

          <div class="btn-group">
            <button onclick="printFilteredTable()"><i class="fa-solid fa-print"></i> Принт</button>
            <button onclick="exportFilteredToExcel()"><i class="fa-solid fa-file-excel"></i> Ексел</button>
          </div>

          <div id="filterSummary" class="summary"></div>

          <div class="table-responsive">
            <table id="recordsTable">
              <thead><tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Кат.</th><th>Бележка</th><th>Действия</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="main.js" type="module"></script>
</body>
</html>

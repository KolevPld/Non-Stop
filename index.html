<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Нон Стоп Отчет</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="status">⏳ Свързване с Firestore...</div>

<div id="login">
  <h2><i class="fa-solid fa-lock"></i> Въведи парола</h2>
  <input type="password" id="password" placeholder="Парола">
  <button onclick="checkPassword()">Вход</button>
</div>

<div id="app" class="hidden">
  <section id="screen-report" class="screen hidden">
  <h3><i class="fa-solid fa-chart-pie"></i> Отчети</h3>

  <div class="summary" id="methodSummary"></div>
  <div class="summary" id="methodSummaryExtra"></div>
  <div class="summary" id="dailySummary"></div>
  <div class="summary" id="monthlySummary"></div>
  <div class="summary" id="taxSummary"></div>
  <canvas id="chart" width="400" height="200" style="margin-top:20px;"></canvas>

  <div class="btn-group" style="margin: 15px 0;">
    <button onclick="showScreen('add')"><i class="fa-solid fa-arrow-left"></i> Назад</button>
  </div>

  <div class="date-range-group">
    <label>
      От:
      <input type="date" id="startDate" onchange="applyFilters()">
    </label>
    <label>
      До:
      <input type="date" id="endDate" onchange="applyFilters()">
    </label>
    <button onclick="setCurrentMonth()">
      <i class="fa-solid fa-calendar-days"></i> Текущ месец
    </button>
  </div>

  <div class="summary">
    <h3><i class="fa-solid fa-filter"></i> Филтрирай записите</h3>
    <div class="filter-group">
      <select id="filterType" onchange="applyFilters()">
        <option value="">Всички типове</option>
        <option>Приход</option>
        <option>Разход</option>
      </select>
      <select id="filterMethod" onchange="applyFilters()">
        <option value="">Всички методи</option>
        <option>Кеш</option>
        <option>Банка</option>
        <option>Карта</option>
      </select>
      <select id="filterCategory" onchange="applyFilters()">
        <option value="">Всички категории</option>
        <option>Оборот</option>
        <option>Стока</option>
        <option>Заплати</option>
        <option>Наеми</option>
        <option>Друго</option>
      </select>
      <select id="filterStore" onchange="applyFilters()">
        <option value="">Всички магазини</option>
        <option value="1">Магазин 1</option>
        <option value="2">Магазин 2</option>
        <option value="Каса">Каса</option>
      </select>
    </div>
  </div>

  <div style="text-align:right; margin-top:10px;">
    <button onclick="clearFilters()" style="background:#757575;">Изчисти филтрите</button>
  </div>

  <div class="btn-group" style="margin: 15px 0;">
    <button onclick="printFilteredTable()" style="background:#607d8b;"><i class="fa-solid fa-print"></i> Принтирай</button>
    <button onclick="exportFilteredToExcel()" style="background:#388e3c;"><i class="fa-solid fa-file-excel"></i> Ексел</button>
  </div>

  <div id="filterSummary" class="summary"></div>

  <div class="table-responsive">
    <table id="recordsTable">
      <thead>
        <tr><th>Дата</th><th>Тип</th><th>Сума</th><th>Метод</th><th>Кат.</th><th>Бележка</th><th>Действия</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
<script src="main.js" type="module"></script>

</body>
</html>

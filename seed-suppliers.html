<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зареждане на доставчици — Нон Стоп</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0d1117; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 14px; padding: 36px 32px; max-width: 520px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
    h2 { margin: 0 0 8px; color: #58a6ff; font-size: 1.4rem; }
    .sub { color: #8b949e; font-size: .875rem; margin-bottom: 28px; }
    label { display: block; font-size: .8rem; color: #8b949e; margin-bottom: 4px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #30363d; background: #0d1117; color: #e0e0e0; border-radius: 8px; font-size: 1rem; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #58a6ff; }
    button { width: 100%; padding: 13px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 4px; transition: background .2s; }
    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #21262d; border: 1px solid #30363d; margin-top: 10px; }
    button.secondary:hover:not(:disabled) { background: #30363d; }
    #log { margin-top: 18px; font-size: .82rem; max-height: 260px; overflow-y: auto; padding: 4px 0; }
    .ok   { color: #3fb950; padding: 2px 0; }
    .err  { color: #f85149; padding: 2px 0; }
    .warn { color: #d29922; padding: 4px 0; }
    .info { color: #8b949e; padding: 2px 0; }
    #seedSection { display: none; }
    #checkResult { padding: 12px 14px; border-radius: 8px; background: #21262d; margin-bottom: 18px; font-size: .875rem; line-height: 1.5; }
    progress { width: 100%; height: 8px; border-radius: 4px; margin-top: 10px; appearance: none; }
    progress::-webkit-progress-bar { background: #21262d; border-radius: 4px; }
    progress::-webkit-progress-value { background: #238636; border-radius: 4px; }
    .note { font-size: .75rem; color: #8b949e; margin-top: 14px; padding: 10px 12px; border: 1px solid #30363d; border-radius: 6px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <h2>🏪 Зареждане на доставчици</h2>
  <p class="sub">Еднократен скрипт — зарежда 75 доставчика за Магазин 1 и Магазин 2</p>

  <div id="loginSection">
    <label>Email (owner акаунт)</label>
    <input id="email" type="email" placeholder="owner@example.com">
    <label>Парола</label>
    <input id="pass" type="password" placeholder="••••••••"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">🔑 Вход и проверка</button>
  </div>

  <div id="seedSection">
    <div id="checkResult"></div>
    <button id="seedBtn" onclick="doSeed()">📥 Зареди 75 доставчика × 2 магазина</button>
    <button class="secondary" onclick="location.reload()">← Назад</button>
    <progress id="prog" value="0" max="150" style="display:none"></progress>
    <p class="note">⚠️ След успешно зареждане изтрий този файл (<code>seed-suppliers.html</code>) от проекта.</p>
  </div>

  <div id="log"></div>
</div>

<script type="module">

import { getFirestore, collection, addDoc, getDocs, query, where }
                             from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword }
                             from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyD692ktQboNPavUgo9XiANtaqm-8tUOB6c",
  authDomain:        "nonstopapp-c30b1.firebaseapp.com",
  projectId:         "nonstopapp-c30b1",
  storageBucket:     "nonstopapp-c30b1.firebasestorage.app",
  messagingSenderId: "368870682423",
  appId:             "1:368870682423:web:5f0ff3245c07c7796a74b2"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

const SUPPLIERS = [

  "Интервино",

  "Корона С ЕООД",
  "Краун - 95 - ЕООД",

  "Хайков ЕООД",
  "Хрис Трейд 2021 - ЕООД",
  "Чембо - 2015 - ЕООД"
];

function log(msg, cls = "info") {
  const el = document.getElementById("log");
  const d  = document.createElement("div");
  d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

window.doLogin = async function () {
  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("pass").value;
  if (!email || !pass) { log("Попълни email и парола!", "err"); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    log("✅ Влязох успешно като: " + email, "ok");

    const snap = await getDocs(query(collection(db, "suppliers"), where("shopId", "==", "store1")));
    const cr   = document.getElementById("checkResult");
    if (snap.size >= SUPPLIERS.length) {
      cr.innerHTML = `⚠️ Вече има <strong>${snap.size * 2}</strong> записа в колекцията (и за двата магазина). Можеш да добавиш отново само ако данните са изтрити.`;
      cr.style.color = "#d29922";
    } else {
      cr.innerHTML = `✅ Колекцията е готова за зареждане (намерени: ${snap.size} записа за store1).`;
      cr.style.color = "#3fb950";
    }

    document.getElementById("loginSection").style.display = "none";
    document.getElementById("seedSection").style.display  = "block";
  } catch (e) {
    log("❌ Грешка при вход: " + e.message, "err");
  }
};

window.doSeed = async function () {
  const btn  = document.getElementById("seedBtn");
  const prog = document.getElementById("prog");
  btn.disabled     = true;
  prog.style.display = "block";
  prog.value = 0;
  prog.max   = SUPPLIERS.length * 2;

  log("Започва зареждане…");
  const now = new Date().toISOString();
  let count = 0;

  try {
    for (const name of SUPPLIERS) {
      for (const shopId of ["store1", "store2"]) {
        await addDoc(collection(db, "suppliers"), { shopId, name, lastUsed: now });
        count++;
        prog.value = count;
      }
    }
    log(`🎉 Готово! Заредени ${count} записа (${SUPPLIERS.length} доставчика × 2 магазина).`, "ok");
    btn.textContent = "✅ Готово!";
  } catch (e) {
    log("❌ Грешка: " + e.message, "err");
    btn.disabled = false;
  }
};
</script>
</body>
</html>
